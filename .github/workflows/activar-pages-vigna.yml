name: Activar GitHub Pages permanente

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activar-pages-vigna.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  activar-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Solicitar una nueva compilación del sitio configurado
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"

          build_status=$(curl --silent --show-error \
            --output pages-build.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/builds")

          if [[ "${build_status}" != "201" && "${build_status}" != "202" ]]; then
            cat pages-build.json
            exit 1
          fi

          echo "La compilación de GitHub Pages fue solicitada."
