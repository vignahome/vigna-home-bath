name: Activar GitHub Pages permanente

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activar-pages-vigna.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  activar-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Solicitar una nueva compilación del sitio configurado
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"

          info_status=$(curl --silent --show-error \
            --output pages-info.json \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")

          if [[ "${info_status}" != "200" ]]; then
            cat pages-info.json
            exit 1
          fi

          jq '{html_url, build_type, source, status}' pages-info.json

          build_status=$(curl --silent --show-error \
            --output pages-build.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/builds")

          if [[ "${build_status}" != "201" && "${build_status}" != "202" ]]; then
            cat pages-build.json
            exit 1
          fi

          cat pages-build.json

          final_status="queued"
          for attempt in {1..12}; do
            sleep 5
            curl --silent --show-error \
              --output pages-latest.json \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/builds/latest"
            final_status=$(jq --raw-output '.status' pages-latest.json)
            jq '{status, error, message, commit}' pages-latest.json
            if [[ "${final_status}" == "built" ]]; then
              echo "GitHub Pages terminó de publicar main."
              exit 0
            fi
            if [[ "${final_status}" == "errored" ]]; then
              exit 1
            fi
          done

          echo "La compilación continúa en estado ${final_status}."
          exit 1
