name: Vista previa de Profesionales Vigna's

on:
  push:
    branches:
      - agent/profesionales-vigna-mvp
    paths:
      - "mvp-profesionales.html"
      - "mvp-profesionales.css"
      - "mvp-profesionales.js"
      - "mvp-profesionales-*.js"
      - "preparar-hosting-profesionales.js"
      - "firebase.js"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "verificar-garantias-reclamos.cjs"
      - "images/logo/**"
      - ".github/workflows/profesionales-mvp-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profesionales-vigna-mvp-preview
  cancel-in-progress: true

jobs:
  validar-y-publicar:
    if: github.ref == 'refs/heads/agent/profesionales-vigna-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar la rama MVP
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar el código
        run: npm run check

      - name: Preparar la publicación aislada
        run: npm run build:profesionales

      - name: Verificar límites de seguridad
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "agent/profesionales-vigna-mvp"
          test -f hosting-profesionales/index.html
          test -f hosting-profesionales/mvp-profesionales.html
          test -f hosting-profesionales/mvp-profesionales.js
          test ! -f hosting-profesionales/server.js
          test ! -f hosting-profesionales/.env

      - name: Publicar únicamente la vista previa
        id: publicar
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIGNA_PLOMEROS }}
          projectId: vigna-plomeros
          channelId: profesionales-mvp
          expires: 30d

      - name: Guardar el resultado de la vista previa
        env:
          PREVIEW_OUTCOME: ${{ steps.publicar.outcome }}
          PREVIEW_URLS: ${{ steps.publicar.outputs.urls }}
          PREVIEW_DETAILS_URL: ${{ steps.publicar.outputs.details_url }}
        run: |
          node -e 'const fs=require("fs"); const urls=JSON.parse(process.env.PREVIEW_URLS||"[]"); const lines=["# Vista previa de Profesionales Vigna", "", `Estado: ${process.env.PREVIEW_OUTCOME}`]; if(urls[0]) lines.push("", `[Abrir vista previa](${urls[0]})`); if(process.env.PREVIEW_DETAILS_URL) lines.push("", `[Ver detalles](${process.env.PREVIEW_DETAILS_URL})`); fs.writeFileSync("VISTA_PREVIA_PROFESIONALES.md", `${lines.join("\n")}\n`);'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VISTA_PREVIA_PROFESIONALES.md
          if ! git diff --cached --quiet; then
            git commit -m "Registrar enlace de vista previa"
            git push
          fi

      - name: Confirmar la publicación
        if: steps.publicar.outcome != 'success'
        run: exit 1
